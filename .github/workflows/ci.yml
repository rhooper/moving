# Lint (Ubuntu) and test (macOS) on every push to any branch, and on pull
# requests (from forks).
#
# The suite needs no printer, no model and no network: the printer is forced
# to `fake` and vision to `stub` in tests/conftest.py, and no test may make a
# network call. zbar is installed so the label tests decode real QR codes
# rather than skipping, and node runs tests/*.test.mjs (through pytest) and the
# JS/CSS linters. The headless-Chrome browser checks are not run here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked
      - run: npm ci --no-audit --no-fund
      - run: make lint

  test:
    # macOS, not Ubuntu: the label goldens compare bytes, and FreeType on
    # Linux rasterises Inter a pixel row differently. The app is developed and
    # deployed on a Mac, so that is the rendering the goldens pin.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zbar (QR decoding in the label tests)
        run: brew install zbar
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run pytest -q
