# Lint (Ubuntu) and test (macOS) on every push to any branch, and on pull
# requests (from forks).
#
# The suite needs no printer, no model and no network: the printer is forced
# to `fake` and vision to `stub` in tests/conftest.py, and no test may make a
# network call. zbar is installed so the label tests decode real QR codes
# rather than skipping, and node runs tests/*.test.mjs (through pytest) and the
# JS/CSS linters. The headless-Chrome browser checks are not run here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked
      - run: npm ci --no-audit --no-fund
      - run: make lint

  test:
    # macOS, not Ubuntu: the label goldens compare bytes, and on Linux Inter
    # comes out a pixel row different. The app is developed and deployed on a
    # Mac, so that is the rendering the goldens pin.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # zbar: the label tests decode their QR codes. fribidi: without it Pillow
      # drops from raqm to its basic text layout, and every golden differs.
      - name: Install zbar and fribidi
        run: brew install zbar fribidi
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run pytest -q
      # A golden mismatch says only where the label changed; the rendering
      # itself is what has to be looked at.
      - name: Render the golden cases for inspection
        if: failure()
        run: |
          uv run python -c "from PIL import features; features.pilinfo(supported_formats=False)"
          uv run python scripts/claude/render_samples.py rendered --golden
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rendered-labels
          path: rendered/
