<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Moving boxes</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* The printed label is the design: its typeface, true black, and the room's
   knockout band. */
@font-face {
  font-family: "Inter";
  src: url("/Inter.ttf") format("truetype-variations");
  font-weight: 100 900;
  font-display: swap;
}

:root {
  --paper: #fafaf8;
  --ink: #000;
  --muted: #6b6b66;
  --line: #d8d8d2;
  --sunk: #efefe9;
  --signal: #ff5a1f;
  --tap: 48px;
  --bar: 56px;     /* the nav bar: a 24px mark stacked over its word */
  --thumb: 44px;   /* the cover square on a list row */
  --kind-icon: 26px;   /* the kind's mark in that square, while there is no photo */
  /* Box-like surfaces only, and only through this token. Glyphs stay square. */
  --radius: 4px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0a0a0a;
    --ink: #fff;
    --muted: #8f8f88;
    --line: #2a2a28;
    --sunk: #161614;
  }
}

* { box-sizing: border-box; }

/* The JS hides things with el.hidden, and the browser's own rule for it loses
   to any author display rule (a display: flex badge would never hide).
   Author-level and !important, so no display rule can defeat it. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
  /* stylelint-disable-next-line property-no-vendor-prefix -- Safari has no unprefixed form */
  -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}

main { max-width: 34rem; margin: 0 auto; padding: 0.25rem 1rem 6rem; }

/* --- the way home: top left, on every page --- */
.home {
  /* A 48px target around a 32px mark, pulled left so the *mark* lines up with
     the text below. The mark's 16-unit grid lands on whole pixels at multiples
     of 8. */
  display: flex;
  align-items: center;
  gap: 0.6rem;
  width: max-content;
  min-height: var(--tap);
  /* Follows <main>'s left edge, less the link's own 0.5rem, never off screen. */
  margin: 0.25rem 0 0 max(0.5rem, calc((100vw - 34rem) / 2 + 0.5rem));
  padding: 0 0.5rem;
  color: var(--ink);
  text-decoration: none;
}
.home svg { width: 32px; height: 32px; flex: none; }
.home span { display: none; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
.home:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }

/* --- the icon family: symbols in the sprite at the top of <body> ---------
   `fill` is set here, on the referencing element, not on the sprite: a <use>
   clone's ancestors are this <svg>, so the sprite's own fill never reaches the
   paths, and every mark would be black on black in dark mode. 16px is the
   base; anywhere else sets its own size. */
.i { flex: none; width: 16px; height: 16px; fill: currentcolor; }

a { color: inherit; }

/* --- the box identity, mirroring the tape --- */
.code {
  font-size: clamp(3.25rem, 17vw, 5.5rem);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 0.9;
  margin: 0.5rem 0 0.75rem;
}

.band {
  background: var(--ink);
  color: var(--paper);
  font-weight: 800;
  font-size: clamp(1.25rem, 6vw, 1.75rem);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  padding: 0.6rem 0.9rem;
  margin: 0 -1rem 1rem;
  border-radius: var(--radius);
}

.flags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
.flag {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: var(--signal);
  color: #fff;
  font-weight: 800;
  font-size: 0.8125rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.25rem 0.55rem;
  border-radius: var(--radius);
}

.meta { color: var(--muted); font-size: 0.9375rem; margin: 0 0 0.25rem; }

/* --- the record, to read: the pictures first, then four lines --- */
.top { display: flex; align-items: center; gap: 0.75rem; }
.top .code { flex: 1; min-width: 0; font-size: clamp(2.5rem, 13vw, 4rem); margin: 0.5rem 0; }
.top .btn { flex: 0 0 auto; width: auto; min-height: var(--tap); padding-inline: 1rem; }
/* The one wordless button, the camera: a full tap, square, its mark at 24 px. */
.top .mark { width: var(--tap); padding: 0; display: inline-grid; place-items: center; }
.top .mark .i { width: 24px; height: 24px; }
.summary { margin: 0 0 0.75rem; }
.summary.none { color: var(--muted); }

/* One field, two kinds of picture: the record's own photographs and the covers
   of the things inside it. They are the same size because they answer the same
   question; only what is inside carries a code, because only that can be
   opened. --tile is local: it is this sheet's measure, not the app's. */
.sheet { --tile: 78px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 1rem; }
.sheet .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr)); gap: 4px; padding: 6px; }
/* Both halves are the same grid, so the rule between them belongs to the
   second and only when there is a first. */
.sheet #view-inside { border-top: 1px solid var(--line); }
.sheet[data-photos="none"] #view-inside { border-top: 0; }
.sheet .tile { display: block; width: 100%; min-height: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; text-decoration: none; cursor: pointer; }
.sheet .pic { position: relative; display: grid; place-items: center; aspect-ratio: 1; background: var(--sunk); border-radius: var(--radius); overflow: hidden; }
.sheet .pic img { position: relative; display: block; width: 100%; height: 100%; object-fit: cover; }
.sheet .pic .tk { position: absolute; inset: 0; margin: auto; width: var(--kind-icon); height: var(--kind-icon); color: var(--muted); opacity: 0.45; }
.sheet .cap { display: block; margin-top: 2px; font-size: 0.7rem; font-weight: 650; }
.sheet .more { display: grid; place-items: center; aspect-ratio: 1; background: var(--sunk); border-radius: var(--radius); font-size: 0.8rem; font-weight: 650; }
.sheet .count { display: flex; justify-content: space-between; align-items: baseline; margin: 0; padding: 0 0.5rem 0.45rem; font-size: 0.78rem; color: var(--muted); }
.sheet .count b { color: var(--ink); font-weight: 650; }

/* Label and value, no headings: eight sections of the editor become four
   lines, by removing chrome rather than by shrinking anything. */
.facts { margin: 0 0 1rem; border-top: 1px solid var(--line); }
.fact { display: flex; gap: 0.75rem; align-items: baseline; padding: 0.45rem 0.1rem; border-bottom: 1px solid var(--line); }
.fact dt { flex: 0 0 5.5rem; margin: 0; color: var(--muted); font-size: 0.8125rem; }
.fact dd { flex: 1; min-width: 0; margin: 0; }
.pill { display: inline-block; padding: 0 0.45rem; border: 1px solid var(--ink); border-radius: var(--radius); font-size: 0.8rem; font-weight: 650; }
.fact .fold { border-top: 0; }
.fact .fold > summary { align-items: baseline; min-height: 0; padding: 0.1rem 0; color: inherit; font-size: inherit; font-weight: 400; }
.fact .groups { margin: 0.25rem 0 0.5rem; }
.fact .groups h3 { margin: 0.6rem 0 0.15rem; color: var(--muted); font-size: 0.75rem; font-weight: 650; }
.fact .groups h3:first-child { margin-top: 0; }
.fact .groups ul { margin: 0; padding: 0; list-style: none; }
.fact .groups li { display: flex; justify-content: space-between; gap: 0.5rem; padding: 0.1rem 0; }
.fact .groups .qty { color: var(--muted); font-variant-numeric: tabular-nums; }

.view-acts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.view-acts .btn { width: auto; padding-inline: 1rem; }

/* --- state that changes: separated from identity by a rule --- */
.section { border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 1.5rem; }
.section h2 { font-size: 1rem; font-weight: 650; margin: 0 0 0.75rem; }

.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.step {
  min-height: var(--tap);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.75rem;
  font-weight: 650;
  cursor: pointer;
  padding: 0.35rem 0.15rem;
}
.step.done { border-color: var(--ink); color: var(--ink); }
.step.now { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.step:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

input, textarea, button, select {
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.65rem 0.75rem;
  min-height: var(--tap);
  width: 100%;
}
input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 3px solid var(--signal);
  outline-offset: 2px;
}

.btn {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  font-weight: 650;
  cursor: pointer;
}
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }

.row { display: flex; gap: 0.5rem; }
.row > :first-child { flex: 1; }
.row > .btn { width: auto; padding-inline: 1rem; }

ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--line);
}
ul.items li span { flex: 1; }
ul.items .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
ul.items .ai { color: var(--muted); font-size: 0.75rem; }
ul.items button { width: auto; min-height: 2rem; padding: 0.2rem 0.5rem; border: 0; background: none; color: var(--muted); cursor: pointer; }

/* An item's name is a button that becomes a field when tapped. The field is
   exactly as tall as the Remove button beside it, so opening one does not move
   the rows below. */
ul.items .what { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; min-width: 0; }
/* Beside an editable name the count takes only the room it needs. */
ul.items .what ~ .qty { flex: 0 0 auto; }
ul.items .what .ai { flex: 0 0 auto; }
ul.items .name {
  flex: 0 1 auto;
  max-width: 100%;
  padding: 0.2rem 0;
  color: var(--ink);
  text-align: left;
  overflow-wrap: anywhere;
  cursor: text;
}
ul.items .rename { flex: 1; min-width: 0; min-height: 2rem; height: 2rem; padding: 0 0.4rem; }
ul.items li.renaming .ai { display: none; }

.boxlist { list-style: none; margin: 0; padding: 0; }
/* Striped rows. The stripe is on the link, whose indent is padding, so it spans
   the full row while an indented row's content steps in; :nth-child re-stripes
   itself on a live refresh. Square: a stripe is a rule, not a box.

   --depth (groupMatches) is capped at three steps here, so deep nesting cannot
   walk off a 320px screen. */
.boxlist li > a {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.6rem;
  padding-left: calc(0.6rem + 0.85rem * min(var(--depth, 0), 3));
  text-decoration: none;
}
.boxlist li:nth-child(even) > a { background: var(--sunk); }

/* The cover thumbnail frame, on every row at a fixed size and never sized from
   the image, so a photo arriving on a live refresh fills its gap rather than
   pushing the list down under a thumb. */
.boxlist .t {
  flex: 0 0 var(--thumb);
  width: var(--thumb);
  height: var(--thumb);
  align-self: center;  /* the text spans keep the baseline; a 44px image cannot */
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
/* The kind's mark, under the photo, so a picture paints over it and no JS
   decides when it shows. */
.boxlist .t .tk {
  position: absolute;
  inset: 0;
  margin: auto;
  width: var(--kind-icon);
  height: var(--kind-icon);
  color: var(--muted);
  opacity: 0.45;
}
.boxlist .t img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; }

/* "Inside this crate": the list's rows at half again the size. 40, not 39, for
   the mark: multiples of 8 land every edge on a whole pixel. */
#inside { --thumb: 66px; --kind-icon: 40px; }

.boxlist .c { font-weight: 800; letter-spacing: -0.02em; }
.boxlist .s { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.boxlist .w {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  font-size: 0.8125rem;
  line-height: 1.25;
  color: var(--muted);
  white-space: nowrap;
}
/* What it is, over how far along it is, over how much is inside it. */
.boxlist .w .k { color: var(--ink); font-weight: 650; }
.boxlist .w .in { color: var(--ink); }

/* A container shown because something inside it matched: quieted, still tappable. */
.boxlist li[data-context] .c { color: var(--muted); font-weight: 650; }

/* The path out of a nested record, outermost first, above the code. */
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 0 0.15rem; margin: 0.25rem 0 -0.25rem; font-size: 1rem; color: var(--muted); }
.trail .sep { user-select: none; }
@media (min-width: 46rem) { .trail { flex-wrap: nowrap; white-space: nowrap; } }

/* Both links to the containing record, in one rule so they cannot drift apart:
   body size, and a full --tap tall. The line holding one keeps its height with
   or without it (#inside-of), and the first crumb is pulled back by its padding
   so the row starts on the column's edge. */
.trail a, #inside-of a {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  /* A space wide, so the sentence still reads as one. */
  padding-inline: 0.25rem;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
}
.trail a:first-child { margin-left: -0.25rem; }
/* The current page: not a link, but spaced like one so separators sit evenly. */
.trail [aria-current] { padding-inline: 0.25rem; }
.trail a:focus-visible, #inside-of a:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }

/* Holds its height with or without the link, so a move, redrawn in place under
   a finger, never shifts the section below. showInside() wraps the sentence in
   a span: a flex container would swallow the spaces around the link. */
#inside-of { display: flex; flex-wrap: wrap; align-items: center; min-height: var(--tap); margin: 0; font-size: 1rem; }

.empty { color: var(--muted); padding: 2rem 0; }
.empty p { margin: 0 0 1rem; }

.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: 2px;
  background: var(--line);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
/* The mark over the word, never instead of it. That grows the bar from --tap to
   --bar, so whatever sits above the bar measures from --bar. */
.bar a {
  flex: 1;
  min-height: var(--bar);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.1rem;
  background: var(--paper);
  text-decoration: none;
  font-weight: 650;
  font-size: 0.8125rem;
}
.bar a .i { width: 24px; height: 24px; }
.bar a[aria-current="page"] { background: var(--ink); color: var(--paper); }

/* Desktop: the nav moves to the top, one row, the mark beside the word. */
@media (min-width: 46rem) {
  :root { --bar: var(--tap); }

  main { padding-top: 4.5rem; padding-bottom: 3rem; }

  /* The top-left corner is the corner of the bar. */
  .home {
    position: fixed;
    top: 0;
    left: 0.5rem;
    z-index: 2;
    margin: 0;
    padding-inline: 0.5rem;
  }
  .home svg { width: 24px; height: 24px; }
  .home span { display: inline; }

  /* Edge to edge on a phone; aligned to the column here. */
  .band { margin-inline: 0; }

  .bar {
    top: 0;
    bottom: auto;
    border-top: 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0;
    justify-content: center;
    gap: 1px;  /* hairline between items; the band's --line shows through */
  }
  .bar a {
    flex: 0 0 auto;
    flex-direction: row;
    gap: 0.5rem;
    padding-inline: 1.5rem;
    font-size: 0.9375rem;
  }
  .bar a .i { width: 20px; height: 20px; }
  /* .bar .version, not .version: the phone rule comes later in this file, and
     at equal specificity later wins. */
  .bar .version {
    position: static;
    display: flex;
    align-items: center;
    padding: 0 1rem;
    background: var(--paper);
    font-size: 0.8125rem;
  }
}

/* A held refresh. Above the nav, not in the page: the page must not move. */
#live {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--bar) + env(safe-area-inset-bottom));
  z-index: 2;
  width: 100%;
  min-height: 2.5rem;
  border: 0;
  border-top: 1px solid var(--line);
  background: var(--signal);
  color: #fff;
  font-weight: 650;
  font-size: 0.9375rem;
  border-radius: var(--radius);
  cursor: pointer;
}
@media (min-width: 46rem) {
  #live { top: var(--bar); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); }
}

.err { border-left: 3px solid var(--signal); padding: 0.5rem 0.75rem; margin: 1rem 0; }

.say { border-left: 3px solid var(--ink); padding: 0.5rem 0.75rem; margin: 0 0 1rem; background: var(--sunk); border-radius: var(--radius); }
.say.warn { border-left-color: var(--signal); }

/* Photo reading spend against the cap. Not .bar, which is the navigation. */
.spend { margin: 0.75rem 0 0.25rem; }
.spend .spent { font-weight: 600; }
.gauge { height: 6px; background: var(--sunk); border: 1px solid var(--line); margin: 0 0 0.75rem; }
.gauge span { display: block; height: 100%; background: var(--ink); }
[data-reading="over"] .gauge span { background: var(--signal); }

/* The autosave line, with Undo. Always there and as tall as the button it may
   hold, so "Saved" arriving while somebody types never moves the page. */
.autosave {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-height: 2.25rem;
  margin: 0.25rem 0 0;
  color: var(--muted);
  font-size: 0.8125rem;
  line-height: 1.3;
}
/* Undo sits at the far end so it cannot slide when the text changes: pressing
   it blurs the field, which changes the text between press and release. */
.autosave-state { flex: 1; min-width: 0; }
.autosave.warn .autosave-state {
  color: var(--ink);
  border-left: 3px solid var(--signal);
  padding-left: 0.4rem;
}
.autosave .undo {
  flex: 0 0 auto;
  width: auto;
  min-height: 2rem;
  padding: 0.15rem 0.7rem;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font-size: 0.8125rem;
  font-weight: 650;
  cursor: pointer;
}

dialog {
  width: min(28rem, calc(100vw - 2rem));
  padding: 1.25rem;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
}
dialog::backdrop { background: rgb(0 0 0 / 0.55); }
dialog h2 { margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 800; letter-spacing: -0.02em; }
/* pre-line: a confirmation may run to two paragraphs. */
dialog p { margin: 0 0 1rem; overflow-wrap: anywhere; white-space: pre-line; }
dialog form { margin: 0; }
/* The photo viewer scrolls as a whole on a phone rather than clipping the list. */
dialog.viewer {
  width: min(64rem, calc(100vw - 1rem));
  max-height: calc(100dvh - 1rem);
  padding: 0.75rem;
  overflow: auto;
}
dialog.viewer img {
  display: block;
  width: 100%;
  max-height: 60dvh;
  object-fit: contain;
  background: var(--sunk);
  border-radius: var(--radius);
}
dialog.viewer .seen { padding: 0.75rem 0.25rem 0.25rem; }
dialog.viewer .seen h2 { margin-bottom: 0.35rem; }
dialog.viewer .seen p { margin: 0 0 0.6rem; }
dialog.viewer ul.items { margin-bottom: 0.75rem; }
/* No Remove button here to hold the count at the edge. */
dialog.viewer ul.items .qty { flex: 0 0 auto; }
dialog.viewer[data-state="error"] .note { color: var(--signal); }
dialog.viewer .reads { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
dialog.viewer .reads .btn { width: auto; padding-inline: 1rem; }
dialog.viewer .reads .meta { flex: 1 1 100%; margin: 0; }
@media (min-width: 52rem) {
  dialog.viewer[open] { display: grid; grid-template-columns: minmax(0, 3fr) minmax(16rem, 2fr); gap: 1rem; }
  dialog.viewer img { max-height: calc(100dvh - 3rem); }
  dialog.viewer .seen { padding-top: 0; overflow: auto; }
}

dialog .row > * { flex: 1; }

/* The sub-item editor scrolls as a whole on a phone. */
dialog.editor { width: min(32rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto; border-radius: var(--radius); }
dialog.editor h2 { margin-bottom: 0.2rem; }
dialog.editor #child-where { margin-bottom: 0.5rem; }
dialog.editor form { margin: 0; }
dialog.editor #child-links { margin: 0.75rem 0 0.5rem; }

/* Folding sections (<details>). The marker is drawn here, since the default
   differs between browsers, and removing the default takes three rules:
   Firefox stops once the summary is not a list-item, Safari needs the
   pseudo-element, and list-style covers the rest. */
.fold { border-top: 1px solid var(--line); }
.fold > summary {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-height: var(--tap);
  list-style: none;
  color: var(--muted);
  font-size: 0.8125rem;
  font-weight: 650;
  cursor: pointer;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: ">"; width: 1ch; color: var(--ink); font-weight: 800; }
.fold[open] > summary::before { content: "v"; }
.fold > summary:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }
.fold-body { padding-bottom: 0.75rem; }
.fold-body > .seg:first-child { margin-top: 0; }

/* One fixed shape for the viewfinder and its still, so the dialog does not jump. */
/* The live camera's own field, the same in the add-inside dialog and on the
   new-record form. Its parts are hidden until there is something to show, so
   a refused camera adds nothing but a line. */
.photo-field .row { margin-top: 0.5rem; }
.shotbox { aspect-ratio: 4 / 3; margin-top: 0.5rem; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.shotbox video, .shotbox img { display: block; width: 100%; height: 100%; object-fit: cover; }

dialog.adder { width: min(30rem, calc(100vw - 2rem)); }
dialog.adder .nb { white-space: nowrap; }
#goes-with { margin-top: 0.5rem; }
dialog.adder .seg { margin-top: 0.5rem; }
dialog.adder .dlabel { margin-top: 0.75rem; }
dialog.adder .adder-acts { margin-top: 1rem; flex-wrap: wrap; }
dialog.adder .adder-acts > * { flex: 1 1 8rem; }
dialog.adder .meta.warn, dialog.taker .meta.warn { color: var(--ink); border-left: 3px solid var(--signal); padding-left: 0.5rem; }
dialog.taker { width: min(30rem, calc(100vw - 2rem)); }
dialog.taker .nb { white-space: nowrap; }
dialog.taker .taker-acts { margin-top: 1rem; }
#inside-said.warn { color: var(--ink); border-left: 3px solid var(--signal); padding-left: 0.5rem; }
.btn.danger { background: var(--signal); border-color: var(--signal); color: #fff; }

/* The running version: above the bar on a phone, out of its flex flow so it
   takes no tap-sized slot; an item of the bar on a desktop. */
.version {
  position: fixed;
  right: 0.75rem;
  bottom: calc(var(--bar) + env(safe-area-inset-bottom) + 0.3rem);
  padding: 0.1rem 0.4rem;
  background: var(--paper);  /* it floats over the list; give it something to sit on */
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  pointer-events: none;
}

/* Printer trouble, in the bar, on every page. */
.badge {
  display: flex;
  align-items: center;
  padding-inline: 0.9rem;
  background: var(--signal);
  color: #fff;
  font-weight: 700;
  font-size: 0.8125rem;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* Joined pushbuttons over real radios (segmented.js). Each button has its own
   border and overlaps its neighbour by a pixel, so a wrapped row reads as a
   grid. Buttons are as wide as their words and share a full line's slack; the
   ::after item soaks up the last line's, or a lone button would stretch into a
   full-width bar. */
.seg { border: 0; padding: 0; margin: 0.75rem 0 0; min-width: 0; }
.seg legend { padding: 0; }
/* Rounded as one control, seams square. On the row rather than the end buttons,
   because it wraps. `overflow: hidden` does both; the focus ring is inset so
   clipping cannot eat it. */
.seg-row { display: flex; flex-wrap: wrap; padding: 0 1px 1px 0; border-radius: var(--radius); overflow: hidden; }
.seg-row::after { content: ""; flex: 1000 0 0; }
.seg-row label { display: flex; flex: 1 1 auto; margin: 0 -1px -1px 0; position: relative; }
.seg-row input {
  position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none;
}
.seg-row span {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap);
  padding: 0.35rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 0;   /* the row carries it; see .seg-row above */
  background: transparent;
  color: var(--ink);
  font-size: 0.9375rem;
  font-weight: 650;
  text-align: center;
  cursor: pointer;
  user-select: none;
  /* stylelint-disable-next-line property-no-vendor-prefix -- Safari has no unprefixed form */
  -webkit-user-select: none;
}
.seg-row input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--paper); z-index: 1; }
.seg-row input:focus-visible + span { outline: 3px solid var(--signal); outline-offset: -3px; z-index: 2; }
.seg-hint { min-height: 1.1rem; margin: 0.3rem 0 0; font-size: 0.8125rem; line-height: 1.3; }
/* A choice the server would refuse; its radio is really disabled. */
.seg-row label.off span { color: var(--muted); background: var(--sunk); cursor: not-allowed; }
.seg-why { margin: 0.3rem 0 0; font-size: 0.8125rem; line-height: 1.3; }

/* Read by a screen reader, not seen. */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Labels per kind, in Settings. */
ul.items.copies li label { flex: 1; }
ul.items.copies li input { flex: 0 0 4.5rem; width: 4.5rem; min-height: 2.75rem; padding: 0.2rem; text-align: center; }

.flags-set { display: flex; flex-wrap: wrap; gap: 0.5rem; }
/* The glyph is currentColor, so it follows the chip's state. */
.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  width: auto;
  min-height: var(--tap);
  padding-inline: 1rem;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  cursor: pointer;
}
.chip.on { background: var(--signal); border-color: var(--signal); color: #fff; }

.section.danger { border-top-color: var(--signal); }
.section.danger h2 { color: var(--signal); }

/* A button that is working says so and cannot be pressed again. */
button.working, .btn.working { opacity: 0.65; cursor: progress; }
button.working::before {
  content: "";
  display: inline-block;
  width: 0.7em; height: 0.7em;
  margin-right: 0.5em;
  vertical-align: -0.05em;
  border: 2px solid currentcolor;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  button.working::before { animation: none; opacity: 0.5; }
}

.shots { display: flex; flex-wrap: wrap; gap: 0.5rem; }
/* The photo and its buttons are one card: the card is rounded and clips them. */
.shots figure { margin: 0; width: calc(50% - 0.25rem); border-radius: var(--radius); overflow: hidden; }
.shots .acts > *, .shots .mark, .shots .analysis button { border-radius: 0; }
.shots img { width: 100%; height: auto; display: block; background: var(--sunk); }
/* Never wrapping, so one figure cannot grow taller than its neighbour. */
.shots .acts { display: flex; }
.shots .acts > * { flex: 1 1 auto; white-space: nowrap; }
.shots button {
  width: 100%; min-height: 2rem; padding: 0.2rem 0.35rem;
  border: 1px solid var(--line); border-top: 0;
  background: transparent; color: var(--muted); font-size: 0.8125rem; cursor: pointer;
}

/* The cover photo. The outline is inside the image's box, so moving the cover
   never reflows the strip. */
.shots .is-cover img { outline: 3px solid var(--ink); outline-offset: -3px; }
.shots .mark {
  display: flex; align-items: center; justify-content: center;
  min-height: 2rem; padding: 0.2rem;
  border: 1px solid var(--ink); border-top: 0;
  background: var(--ink); color: var(--paper);
  font-size: 0.8125rem; font-weight: 650;
}

/* The reading countdown ring. Fixed colours, not the palette: it is drawn over
   a photograph in either theme. */
.shots .pic { position: relative; }
.shots .ring {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 3.5rem;
  height: 3.5rem;
  border-radius: 50%;
  background: rgb(0 0 0 / 0.6);
  pointer-events: none;  /* the photo underneath still opens when tapped */
}
.shots .ring svg { display: block; width: 100%; height: 100%; }
.ring-track { fill: none; stroke: rgb(255 255 255 / 0.28); stroke-width: 3; }
/* pathLength="100", so the offset is the percentage not yet done; app.js sets
   it inline while there is an honest number. */
.ring-arc { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 100; }
/* Past the estimate: a spinner, since a full ring would claim it had finished. */
.ring.spin .ring-arc { stroke-dashoffset: 75; }
@media (prefers-reduced-motion: no-preference) {
  .ring-arc { transition: stroke-dashoffset 200ms linear; }
  .ring.spin svg { animation: spin 0.9s linear infinite; }
}
/* A still, broken ring: cannot be mistaken for a quarter-full countdown. */
@media (prefers-reduced-motion: reduce) {
  .ring.spin .ring-arc { stroke-dasharray: 6.25; stroke-dashoffset: 0; }
}

/* Keeps its height when empty, so read and unread photos stay level. */
.shots .analysis {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  min-height: 2rem;
  padding-top: 0.15rem;
  color: var(--muted);
  font-size: 0.8125rem;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;  /* the seconds tick without the text shuffling */
}
.shots .analysis .state { flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* An error takes the whole line, with Retry underneath. */
.shots .analysis[data-analysis="error"] { flex-wrap: wrap; }
.shots .analysis[data-analysis="error"] .state {
  flex: 1 1 100%;
  color: var(--ink);
  border-left: 3px solid var(--signal);
  padding-left: 0.4rem;
}
.shots .analysis button { flex: 0 0 auto; width: auto; border-top: 1px solid var(--line); color: var(--ink); }

.dlabel { display: block; font-size: 0.8125rem; color: var(--muted); margin: 0.5rem 0 0.25rem; }

/* A <label> or <a> wearing .btn needs its border drawn: the form-control rule
   that gives every control its hairline does not match them. */
label.btn, a.btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; border: 1px solid var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  .step, .btn, .seg-row span { transition: background-color 90ms linear, color 90ms linear; }
}
</style>
