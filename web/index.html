<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Moving boxes</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* The printed label is the design. Inter is the label's typeface, true black
   is what a thermal printer actually puts on tape, and the knockout band that
   carries the room name on the label carries it here too. */
@font-face {
  font-family: "Inter";
  src: url("/Inter.ttf") format("truetype-variations");
  font-weight: 100 900;
  font-display: swap;
}

:root {
  --paper: #fafaf8;
  --ink: #000;
  --muted: #6b6b66;
  --line: #d8d8d2;
  --sunk: #efefe9;
  --signal: #ff5a1f;
  --tap: 48px;
  --bar: 56px;     /* the nav bar: a 24px mark stacked over its word */
  --thumb: 44px;   /* the cover square on a list row */
  --kind-icon: 26px;   /* the kind's mark in that square, while there is no photo */
  /* Slightly rounded corners on the box-like surfaces, asked for on
     2026-09-20. Only through this token, so "slightly rounded" stays one
     decision rather than a dozen. It does not reach the printed label: that
     is rendered in Python onto tape, and a thermal printer's corners are
     square. Glyphs keep their hard edges -- an icon is type, not a box. */
  --radius: 4px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0a0a0a;
    --ink: #fff;
    --muted: #8f8f88;
    --line: #2a2a28;
    --sunk: #161614;
  }
}

* { box-sizing: border-box; }

/* The JS toggles visibility with el.hidden, and the browser's own
   `[hidden] { display: none }` loses to any author display rule -- which is
   how the printer badge (display: flex) showed "Printer offline" forever
   while the printer sat there online. Author-level and !important so no
   display rule can re-defeat it. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
  /* stylelint-disable-next-line property-no-vendor-prefix -- Safari has no unprefixed form */
  -webkit-text-size-adjust: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}

main { max-width: 34rem; margin: 0 auto; padding: 0.25rem 1rem 6rem; }

/* --- the way home: top left, on every page --- */
.home {
  /* A 48 px target around a 32 px mark, pulled left so the *mark* -- not its
     padding -- lines up with the text below it. 32 because the mark is drawn
     on a 16-unit grid: multiples of 8 land every edge on a whole pixel. */
  display: flex;
  align-items: center;
  gap: 0.6rem;
  width: max-content;
  min-height: var(--tap);
  /* <main> is a centred 34rem column with 1rem of padding; this follows its
     left edge, less the link's own 0.5rem, and never leaves the screen. */
  margin: 0.25rem 0 0 max(0.5rem, calc((100vw - 34rem) / 2 + 0.5rem));
  padding: 0 0.5rem;
  color: var(--ink);
  text-decoration: none;
}
.home svg { width: 32px; height: 32px; flex: none; }
.home span { display: none; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
.home:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }

/* --- the icon family: the home mark's grid, one sprite, no font ---------
   Every mark is one evenodd path on the same 16-unit grid as the mark above
   (source and rationale in docs/design/icons/). They are inlined once as
   <symbol>s at the top of <body> and drawn as <svg class="i"><use href="#i-…">.

   `fill` is set *here*, on the referencing element, and not on the sprite:
   a <use> clones the symbol into a shadow tree whose ancestors are this
   <svg>, so the fill="currentColor" on the sprite's own root never reaches
   the paths. Without this rule every mark is black, which in dark mode is
   black on black. currentcolor also means a chip's `on` state carries its
   glyph with it -- the colour is the chip's state, never the icon's.

   16px is the base: the size beside chip text. Everywhere else says so. */
.i { flex: none; width: 16px; height: 16px; fill: currentcolor; }

a { color: inherit; }

/* --- the box identity: the hero, mirroring the tape in your hand --- */
.code {
  font-size: clamp(3.25rem, 17vw, 5.5rem);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 0.9;
  margin: 0.5rem 0 0.75rem;
}

.band {
  background: var(--ink);
  color: var(--paper);
  font-weight: 800;
  font-size: clamp(1.25rem, 6vw, 1.75rem);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  padding: 0.6rem 0.9rem;
  margin: 0 -1rem 1rem;
  border-radius: var(--radius);
}

.flags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
/* The label's own glyphs, beside the word: these two chips are printed on the
   tape, which is the whole argument for drawing them here. */
.flag {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  background: var(--signal);
  color: #fff;
  font-weight: 800;
  font-size: 0.8125rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.25rem 0.55rem;
  border-radius: var(--radius);
}

.meta { color: var(--muted); font-size: 0.9375rem; margin: 0 0 0.25rem; }

/* --- state that changes: separated from identity by a rule --- */
.section { border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 1.5rem; }
.section h2 { font-size: 1rem; font-weight: 650; margin: 0 0 0.75rem; }

.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.step {
  min-height: var(--tap);
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.75rem;
  font-weight: 650;
  cursor: pointer;
  padding: 0.35rem 0.15rem;
}
.step.done { border-color: var(--ink); color: var(--ink); }
.step.now { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.step:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

input, textarea, button, select {
  font: inherit;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.65rem 0.75rem;
  min-height: var(--tap);
  width: 100%;
}
input:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 3px solid var(--signal);
  outline-offset: 2px;
}

.btn {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  font-weight: 650;
  cursor: pointer;
}
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }

.row { display: flex; gap: 0.5rem; }
.row > :first-child { flex: 1; }
.row > .btn { width: auto; padding-inline: 1rem; }

ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--line);
}
ul.items li span { flex: 1; }
ul.items .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
ul.items .ai { color: var(--muted); font-size: 0.75rem; }
ul.items button { width: auto; min-height: 2rem; padding: 0.2rem 0.5rem; border: 0; background: none; color: var(--muted); cursor: pointer; }

/* An item's name is a button: tap it and it becomes a field. It is set as
   the text it stands for, not as a control -- the list is for reading first.
   The field that replaces it is exactly as tall as the Remove button beside
   it, so opening one does not move the rows below under a thumb. */
ul.items .what { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; min-width: 0; }
/* Beside a name that can be edited, the count takes only the room it needs.
   Sharing the row half and half left a name 40% of a phone's width, which
   pushed "autogenerated" onto a second line and the field down to a stub. */
ul.items .what ~ .qty { flex: 0 0 auto; }
ul.items .what .ai { flex: 0 0 auto; }
ul.items .name {
  flex: 0 1 auto;
  max-width: 100%;
  padding: 0.2rem 0;
  color: var(--ink);
  text-align: left;
  overflow-wrap: anywhere;
  cursor: text;
}
ul.items .rename { flex: 1; min-width: 0; min-height: 2rem; height: 2rem; padding: 0 0.4rem; }
ul.items li.renaming .ai { display: none; }

.boxlist { list-style: none; margin: 0; padding: 0; }
/* The rule under a row is the row's, not its link's: a nested search result
   has a line under the link ("in B-0012") that belongs above the rule. */
.boxlist li { border-bottom: 1px solid var(--line); }
.boxlist li > a {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  padding: 0.6rem 0;
  text-decoration: none;
}

/* The cover thumbnail, so a box is recognisable by sight rather than by
   reading its code. The frame is drawn on every row whether or not there is a
   picture -- fixed size, never derived from the image -- so a row without one
   is the same height as its neighbours, and a photo arriving on a live
   refresh fills the gap instead of pushing the list down under your thumb. */
.boxlist .t {
  flex: 0 0 var(--thumb);
  width: var(--thumb);
  height: var(--thumb);
  align-self: center;  /* the text spans keep the baseline; a 44px image cannot */
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
/* No cover yet: what the record *is*, quietly, in the gap the photo would
   fill. It was the same open box on every row, which said nothing; the kind's
   own mark says something and costs nothing. Drawn under the photo rather
   than instead of it, so a picture simply paints over it and no JS decides
   when it shows. currentcolor via `color`, so it follows the theme. */
.boxlist .t .tk {
  position: absolute;
  inset: 0;
  margin: auto;
  width: var(--kind-icon);
  height: var(--kind-icon);
  color: var(--muted);
  opacity: 0.45;
}
.boxlist .t img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; }

.boxlist .c { font-weight: 800; letter-spacing: -0.02em; }
.boxlist .s { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.boxlist .w {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  font-size: 0.8125rem;
  line-height: 1.25;
  color: var(--muted);
  white-space: nowrap;
}
/* What it is, over how far along it is, over how much is inside it. */
.boxlist .w .k { color: var(--ink); font-weight: 650; }
.boxlist .w .in { color: var(--ink); }

/* A search result that is inside something says where, under its row: a
   link of its own, since a link cannot sit inside the row's link. */
.boxlist .at { display: block; margin: -0.4rem 0 0.55rem calc(var(--thumb) + 0.75rem); font-size: 0.8125rem; color: var(--muted); }
.boxlist .at a { display: inline; padding: 0; border: 0; font-weight: 650; }

/* The way out of a nested record: the path, outermost first, above the code.
   One line on a desktop; on a phone it may wrap. */
.trail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.45rem; margin: 0.25rem 0 -0.25rem; font-size: 0.9375rem; color: var(--muted); }
.trail a { font-weight: 650; color: var(--ink); }
.trail .sep { user-select: none; }
@media (min-width: 46rem) { .trail { flex-wrap: nowrap; white-space: nowrap; } }

.empty { color: var(--muted); padding: 2rem 0; }
.empty p { margin: 0 0 1rem; }

.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  gap: 2px;
  background: var(--line);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
/* The mark over the word, never instead of it: "Items" and "New" are not
   guessable from a list glyph and a plus, and the bar has the room. Stacking
   the two grows the bar from --tap to --bar, which is why everything that
   sits above the bar measures itself from --bar rather than from --tap. */
.bar a {
  flex: 1;
  min-height: var(--bar);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.1rem;
  background: var(--paper);
  text-decoration: none;
  font-weight: 650;
  font-size: 0.8125rem;
}
.bar a .i { width: 24px; height: 24px; }
.bar a[aria-current="page"] { background: var(--ink); color: var(--paper); }

/* On a phone the nav sits at the bottom, where your thumb is. On a desktop
   there is no thumb and the bottom of a tall window is the furthest point
   from the content, so it moves to the top and stops spanning the full
   width. */
@media (min-width: 46rem) {
  /* No thumb up here, and the bar is one row again: the mark sits beside the
     word at 20px and the bar is back to a tap's height. */
  :root { --bar: var(--tap); }

  main { padding-top: 4.5rem; padding-bottom: 3rem; }

  /* On a desktop the top-left corner is the corner of the bar. */
  .home {
    position: fixed;
    top: 0;
    left: 0.5rem;
    z-index: 2;
    margin: 0;
    padding-inline: 0.5rem;
  }
  .home svg { width: 24px; height: 24px; }
  .home span { display: inline; }

  /* The room band runs edge to edge on a phone, mirroring the printed label.
     On desktop the column *is* the page, so it aligns to the column instead
     of hanging 1rem off each side. */
  .band { margin-inline: 0; }

  .bar {
    top: 0;
    bottom: auto;
    border-top: 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0;
    justify-content: center;
    gap: 1px;  /* hairline between items; the band's --line shows through */
  }
  .bar a {
    flex: 0 0 auto;
    flex-direction: row;
    gap: 0.5rem;
    padding-inline: 1.5rem;
    font-size: 0.9375rem;
  }
  .bar a .i { width: 20px; height: 20px; }
  /* .bar .version, not .version: the phone rule above is written later in
     this file than this block, and at equal specificity later wins. */
  .bar .version {
    position: static;
    display: flex;
    align-items: center;
    padding: 0 1rem;
    background: var(--paper);
    font-size: 0.8125rem;
  }
}

/* Shown only when a change arrived while someone was mid-edit or mid-tap, so
   the screen could not simply redraw itself. It sits above the nav rather
   than inside the page, because the page is exactly what must not move. */
#live {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--bar) + env(safe-area-inset-bottom));
  z-index: 2;
  width: 100%;
  min-height: 2.5rem;
  border: 0;
  border-top: 1px solid var(--line);
  background: var(--signal);
  color: #fff;
  font-weight: 650;
  font-size: 0.9375rem;
  border-radius: var(--radius);
  cursor: pointer;
}
@media (min-width: 46rem) {
  #live { top: var(--bar); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); }
}

.err { border-left: 3px solid var(--signal); padding: 0.5rem 0.75rem; margin: 1rem 0; }

.say { border-left: 3px solid var(--ink); padding: 0.5rem 0.75rem; margin: 0 0 1rem; background: var(--sunk); border-radius: var(--radius); }
.say.warn { border-left-color: var(--signal); }

/* The record page saves itself; this line under each of its forms says how
   that is going, and carries Undo. It is always there and as tall as the
   button it sometimes holds, so "Saved" arriving -- every few seconds, while
   somebody types -- never moves the page. A failure is marked the way every
   other one is: ink text, a signal rule down the side. */
.autosave {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-height: 2.25rem;
  margin: 0.25rem 0 0;
  color: var(--muted);
  font-size: 0.8125rem;
  line-height: 1.3;
}
/* The text takes the room and Undo sits at the far end, so the button does
   not slide sideways when "Saving…" becomes "Not saved yet — will retry". It
   did, at first: pressing Undo blurs the field, which changes the text, which
   moved the button out from under the finger between press and release. */
.autosave-state { flex: 1; min-width: 0; }
.autosave.warn .autosave-state {
  color: var(--ink);
  border-left: 3px solid var(--signal);
  padding-left: 0.4rem;
}
.autosave .undo {
  flex: 0 0 auto;
  width: auto;
  min-height: 2rem;
  padding: 0.15rem 0.7rem;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font-size: 0.8125rem;
  font-weight: 650;
  cursor: pointer;
}

/* The override for printing an empty box: present only when it applies, and
   never pre-ticked. */
/* An action failed; the page behind it is still good. */
dialog {
  width: min(28rem, calc(100vw - 2rem));
  padding: 1.25rem;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
}
dialog::backdrop { background: rgb(0 0 0 / 0.55); }
dialog h2 { margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 800; letter-spacing: -0.02em; }
/* pre-line: a confirmation may run to two paragraphs. */
dialog p { margin: 0 0 1rem; overflow-wrap: anywhere; white-space: pre-line; }
dialog form { margin: 0; }
/* One photo, large, with what the model saw in it. Wider than the question
   dialogs, and it scrolls as a whole on a phone rather than clipping the list. */
dialog.viewer {
  width: min(64rem, calc(100vw - 1rem));
  max-height: calc(100dvh - 1rem);
  padding: 0.75rem;
  overflow: auto;
}
dialog.viewer img {
  display: block;
  width: 100%;
  max-height: 60dvh;
  object-fit: contain;
  background: var(--sunk);
  border-radius: var(--radius);
}
dialog.viewer .seen { padding: 0.75rem 0.25rem 0.25rem; }
dialog.viewer .seen h2 { margin-bottom: 0.35rem; }
dialog.viewer .seen p { margin: 0 0 0.6rem; }
dialog.viewer ul.items { margin-bottom: 0.75rem; }
/* No Remove button here to hold the count at the edge, as the main list has. */
dialog.viewer ul.items .qty { flex: 0 0 auto; }
dialog.viewer[data-state="error"] .note { color: var(--signal); }
dialog.viewer .reads { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
dialog.viewer .reads .btn { width: auto; padding-inline: 1rem; }
dialog.viewer .reads .meta { flex: 1 1 100%; margin: 0; }
@media (min-width: 52rem) {
  dialog.viewer[open] { display: grid; grid-template-columns: minmax(0, 3fr) minmax(16rem, 2fr); gap: 1rem; }
  dialog.viewer img { max-height: calc(100dvh - 3rem); }
  dialog.viewer .seen { padding-top: 0; overflow: auto; }
}

dialog .row > * { flex: 1; }
.btn.danger { background: var(--signal); border-color: var(--signal); color: #fff; }

/* The running version. On a phone it sits just above the bar, at the right,
   out of the bar's flex flow so it takes no tap-sized slot; on a desktop it is
   an item of the bar, beside the menu (see the wide-screen rules below). */
.version {
  position: fixed;
  right: 0.75rem;
  bottom: calc(var(--bar) + env(safe-area-inset-bottom) + 0.3rem);
  padding: 0.1rem 0.4rem;
  background: var(--paper);  /* it floats over the list; give it something to sit on */
  font-size: 0.75rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  pointer-events: none;
}

/* Printer trouble, in the bar, on every page. */
.badge {
  display: flex;
  align-items: center;
  padding-inline: 0.9rem;
  background: var(--signal);
  color: #fff;
  font-weight: 700;
  font-size: 0.8125rem;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* A row of joined pushbuttons, [ Box | Tub | Crate ], in place of a dropdown
   (segmented.js). Real radios underneath, each hidden inside the <label>
   drawn as its button. Every button carries its own border and overlaps its
   neighbour's by a pixel, so the row reads as one bar and, when it wraps,
   as a grid -- no half-borders at the ends of a wrapped line. A button is as
   wide as its words need, so a long room name is never cut short, and the
   buttons on a full line share what is left over so the line ends flush. The
   last line does not: an invisible item after the last button soaks up the
   slack there. Without it a lone "Extra large" stretched into a bar the full
   width of the phone, and looked like a different kind of control. The chosen
   one is ink on paper inverted, like .step.now; the signal colour is for the
   focus ring only. */
.seg { border: 0; padding: 0; margin: 0.75rem 0 0; min-width: 0; }
.seg legend { padding: 0; }
.seg-row { display: flex; flex-wrap: wrap; padding: 0 1px 1px 0; }
.seg-row::after { content: ""; flex: 1000 0 0; }
.seg-row label { display: flex; flex: 1 1 auto; margin: 0 -1px -1px 0; position: relative; }
.seg-row input {
  position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none;
}
.seg-row span {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap);
  padding: 0.35rem 0.9rem;
  border: 1px solid var(--line);
  /* Every button, not just the ends of the row: the row wraps, and rounding
     only the first and last would leave half-round corners mid-line. */
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font-size: 0.9375rem;
  font-weight: 650;
  text-align: center;
  cursor: pointer;
  user-select: none;
  /* stylelint-disable-next-line property-no-vendor-prefix -- Safari has no unprefixed form */
  -webkit-user-select: none;
}
.seg-row input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--paper); z-index: 1; }
.seg-row input:focus-visible + span { outline: 3px solid var(--signal); outline-offset: -3px; z-index: 2; }
.seg-hint { min-height: 1.1rem; margin: 0.3rem 0 0; font-size: 0.8125rem; line-height: 1.3; }
/* A button the server would refuse: greyed, and skipped by the arrow keys
   since the radio under it is really disabled. The reason is under the row. */
.seg-row label.off span { color: var(--muted); background: var(--sunk); cursor: not-allowed; }
.seg-why { margin: 0.3rem 0 0; font-size: 0.8125rem; line-height: 1.3; }

/* Read by a screen reader, not seen. */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Labels per kind, in Settings: a name and a small number, in a row. */
ul.items.copies li label { flex: 1; }
ul.items.copies li input { flex: 0 0 4.5rem; width: 4.5rem; min-height: 2.75rem; padding: 0.2rem; text-align: center; }

/* Handling flags: on or off, and they print on the label. */
.flags-set { display: flex; flex-wrap: wrap; gap: 0.5rem; }
/* The glyph is currentColor and follows the chip: `on` is white on the signal
   colour, and the mark goes white with the word. The colour says the state;
   the icon never does. */
.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  width: auto;
  min-height: var(--tap);
  padding-inline: 1rem;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  cursor: pointer;
}
.chip.on { background: var(--signal); border-color: var(--signal); color: #fff; }

/* Destructive, and irreversible: marked, at the bottom, and not a thing you
   land on by accident. */
.section.danger { border-top-color: var(--signal); }
.section.danger h2 { color: var(--signal); }

/* A button that is working says so and cannot be pressed again. */
button.working, .btn.working { opacity: 0.65; cursor: progress; }
button.working::before {
  content: "";
  display: inline-block;
  width: 0.7em; height: 0.7em;
  margin-right: 0.5em;
  vertical-align: -0.05em;
  border: 2px solid currentcolor;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  button.working::before { animation: none; opacity: 0.5; }
}

.shots { display: flex; flex-wrap: wrap; gap: 0.5rem; }
/* The photo and the strip of buttons welded under it are one card, so the
   corners are the card's: the parts inside keep square ones and the card
   clips them. */
.shots figure { margin: 0; width: calc(50% - 0.25rem); border-radius: var(--radius); overflow: hidden; }
.shots .acts > *, .shots .mark, .shots .analysis button { border-radius: 0; }
.shots img { width: 100%; height: auto; display: block; background: var(--sunk); }
/* Sized to their text, sharing what is left over, and never wrapping: at
   320px "Make cover" on two lines made one figure taller than the one beside
   it and left the strip ragged along the bottom. */
.shots .acts { display: flex; }
.shots .acts > * { flex: 1 1 auto; white-space: nowrap; }
.shots button {
  width: 100%; min-height: 2rem; padding: 0.2rem 0.35rem;
  border: 1px solid var(--line); border-top: 0;
  background: transparent; color: var(--muted); font-size: 0.8125rem; cursor: pointer;
}

/* Which photo the box is shown by in the list. The outline is drawn inside
   the image's own box so marking one does not resize it or reflow the strip
   when the cover moves. Monochrome, like the label: the signal colour is
   reserved for warnings and for Fragile. */
.shots .is-cover img { outline: 3px solid var(--ink); outline-offset: -3px; }
.shots .mark {
  display: flex; align-items: center; justify-content: center;
  min-height: 2rem; padding: 0.2rem;
  border: 1px solid var(--ink); border-top: 0;
  background: var(--ink); color: var(--paper);
  font-size: 0.8125rem; font-weight: 650;
}

/* A photo being read by the vision model. The ring sits on the photo it
   belongs to and fills as the server's estimate runs down; its colours are
   fixed rather than from the palette because it is drawn over a photograph,
   not over the page, in either theme. */
.shots .pic { position: relative; }
.shots .ring {
  position: absolute;
  inset: 0;
  margin: auto;
  width: 3.5rem;
  height: 3.5rem;
  border-radius: 50%;
  background: rgb(0 0 0 / 0.6);
  pointer-events: none;  /* the photo underneath still opens when tapped */
}
.shots .ring svg { display: block; width: 100%; height: 100%; }
.ring-track { fill: none; stroke: rgb(255 255 255 / 0.28); stroke-width: 3; }
/* pathLength="100" on the circle, so the offset is simply the percentage not
   yet done. app.js sets it inline while there is an honest number to show. */
.ring-arc { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 100; }
/* Past the estimate and still not done: a spinner, which claims nothing,
   rather than a full ring, which claims it has finished. */
.ring.spin .ring-arc { stroke-dashoffset: 75; }
@media (prefers-reduced-motion: no-preference) {
  .ring-arc { transition: stroke-dashoffset 200ms linear; }
  .ring.spin svg { animation: spin 0.9s linear infinite; }
}
/* No spin. A broken ring reads as "working, no idea how long" while standing
   still, and cannot be mistaken for a quarter-full countdown. */
@media (prefers-reduced-motion: reduce) {
  .ring.spin .ring-arc { stroke-dasharray: 6.25; stroke-dashoffset: 0; }
}

/* What came of it, under the photo's own buttons. The line keeps its height
   when it has nothing to say, so a strip of read and unread photos stays
   level along the bottom. */
.shots .analysis {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  min-height: 2rem;
  padding-top: 0.15rem;
  color: var(--muted);
  font-size: 0.8125rem;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;  /* the seconds tick without the text shuffling */
}
.shots .analysis .state { flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* An error is a sentence, and half a phone's width less a button is no room
   for one: the text takes the whole line and Retry goes underneath. */
.shots .analysis[data-analysis="error"] { flex-wrap: wrap; }
.shots .analysis[data-analysis="error"] .state {
  flex: 1 1 100%;
  color: var(--ink);
  border-left: 3px solid var(--signal);
  padding-left: 0.4rem;
}
.shots .analysis button { flex: 0 0 auto; width: auto; border-top: 1px solid var(--line); color: var(--ink); }

.dlabel { display: block; font-size: 0.8125rem; color: var(--muted); margin: 0.5rem 0 0.25rem; }

label.btn, a.btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }

@media (prefers-reduced-motion: no-preference) {
  .step, .btn, .seg-row span { transition: background-color 90ms linear, color 90ms linear; }
}
</style>
</head>

     referencing element sets the fill -- see the .i rule above. -->

<!-- The home mark: the label's QR finder pattern -- the square a scanner uses
     to find a code's corner and know which way is up -- with its core cut as a
     house. It sits in the app's own top-left corner, as the origin. Inline so
     currentColor follows the theme; 160 bytes is not worth a request. -->
<a href="#/" class="home" aria-label="Home"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M0 0h16v16H0zM2 2v12h12V2zM8 4l4 4v4H4V8z"/></svg><span>Moving</span></a>
<main id="app">Loading…</main>
<button type="button" id="live" hidden>Changed on another device — tap to refresh</button>

     The word is the accessible name, so every mark is aria-hidden. -->
