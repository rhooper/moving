[project]
name = "movingbox"
dynamic = ["version"]
description = "Packing tracker for a house move: box inventory, QR labels on a Brother QL-800, and a scanning PWA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/movingbox/labels/fonts/OFL.txt"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",   # photo uploads
    "pillow>=11.0",               # label raster + thumbnails
    "segno>=1.6",                 # QR generation
    "brother-ql>=0.9.4",          # QL-800 raster protocol
    "pyusb>=1.2",                 # USB backend for brother_ql
    "httpx>=0.27",                # Ollama / Claude vision providers
    "reportlab>=4.2",             # manifest PDF
    "anthropic>=1.7",           # Claude vision provider (the cloud tier)
]

[project.urls]
Repository = "https://github.com/rhooper/moving"

[project.scripts]
moving = "movingbox.cli:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx2>=2.13.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyzbar>=0.1.9",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/movingbox/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/movingbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors: this is what caught sqlite connections leaking out of
# tests. Third-party deprecations we cannot fix are ignored individually rather
# than by relaxing the default.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
# The printer is forced to `fake` in tests/conftest.py, not here: pytest ignores
# an `env` key unless pytest-env is installed, and does so silently.

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Header in argument defaults is how FastAPI declares dependencies;
# B008's "no function call in a default" rule is a false positive for them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]
